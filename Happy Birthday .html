<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A birthday card for the boss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e4eae3; --ink:#24382f; --muted:#4d6258;
  --back:#2b4a41; --left:#3a6054; --right:#33564b; --bottom:#406a5d;
  --flap:#46705f; --flap-in:#1f372f; --brass:#c9a45c; --brass-d:#8f6f2f;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15211d;--ink:#eadfc6;--muted:#a9b5aa;}}
:root[data-theme="dark"]{--bg:#15211d;--ink:#eadfc6;--muted:#a9b5aa;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Spectral",Georgia,serif;font-style:italic;display:flex;align-items:center;justify-content:center;overflow-x:hidden;overflow-y:auto}
.scene{--W:min(540px,88vw,66svh);--H:calc(var(--W)*.64);padding-top:calc(var(--W)*.72);padding-bottom:calc(var(--W)*.2)}
.env{position:relative;width:var(--W);height:var(--H);transform:translateY(calc(var(--W)*-.3));transition:transform 1.1s cubic-bezier(.3,.8,.3,1)}
.full .env{transform:none}
.back{position:absolute;inset:0;background:var(--back);border-radius:4px;z-index:0;box-shadow:0 24px 50px -18px rgba(0,0,0,.55)}
.card{position:absolute;left:4%;width:92%;bottom:6%;aspect-ratio:3/2;z-index:3;transform-origin:50% 100%;transition:transform 1.1s cubic-bezier(.3,.9,.3,1);border-radius:3px;box-shadow:0 6px 22px rgba(0,0,0,.35);background:#e9c58f;overflow:hidden}
.card img{display:block;width:100%;height:100%;object-fit:cover}
.out .card{transform:translateY(-55%)}
.full .card{transform:translateY(-102%) scale(1.14)}
.front{position:absolute;inset:0;z-index:4;pointer-events:none}
.front i{position:absolute;inset:0}
.front .l{background:var(--left);clip-path:polygon(0 0,50.2% 58%,0 100%)}
.front .r{background:var(--right);clip-path:polygon(100% 0,49.8% 58%,100% 100%)}
.front .b{background:var(--bottom);clip-path:polygon(0 100%,50% 58%,100% 100%);border-radius:0 0 4px 4px}
.flap{position:absolute;left:0;top:0;width:100%;height:58%;z-index:5;background:var(--flap);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;transition:transform .8s cubic-bezier(.5,0,.3,1),background .3s .3s,z-index 0s .4s}
.open .flap{transform:perspective(1400px) rotateX(180deg);background:var(--flap-in);z-index:1}
.seal{position:absolute;left:50%;top:58%;width:15%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:6;border:0;border-radius:50%;cursor:pointer;color:#5a431a;background:radial-gradient(circle at 35% 30%,#e8cd8f,var(--brass) 55%,var(--brass-d));box-shadow:0 3px 8px rgba(0,0,0,.45),inset 0 -3px 5px rgba(90,60,10,.4);display:grid;place-items:center;transition:opacity .35s,transform .35s;animation:pulse 2.4s ease-in-out infinite}
.seal svg{width:52%;height:52%}
.seal:focus-visible,.again:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.open .seal{opacity:0;transform:translate(-50%,-50%) scale(.6);pointer-events:none;animation:none}
@keyframes pulse{0%,100%{box-shadow:0 3px 8px rgba(0,0,0,.45),0 0 0 0 rgba(201,164,92,.55)}50%{box-shadow:0 3px 8px rgba(0,0,0,.45),0 0 0 14px rgba(201,164,92,0)}}
.hint,.again{position:absolute;left:0;right:0;top:calc(100% + 1.4rem);text-align:center;font:inherit;font-size:1.05rem;color:var(--muted);transition:opacity .4s}
.again{background:none;border:0;cursor:pointer;color:var(--ink);text-decoration:underline;text-underline-offset:4px;opacity:0;pointer-events:none}
.open .hint{opacity:0}
.full .again{opacity:1;pointer-events:auto}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}}
</style>
</head>

    <div class="flap"></div>
    <button class="seal" id="seal" aria-label="Open the envelope"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17l-6.1 3.6 1.4-6.8L2.2 9.1l6.9-.8z"/></svg></button>

<canvas id="fx" aria-hidden="true"></canvas>
<script>
(function(){
  var scene=document.getElementById('scene'),seal=document.getElementById('seal'),again=document.getElementById('again');
  var rm=window.matchMedia('(prefers-reduced-motion: reduce)').matches,k=rm?0.05:1,busy=false,timers=[];
  function later(f,t){timers.push(setTimeout(f,t*k));}
  seal.addEventListener('click',function(){
    if(busy||scene.classList.contains('open'))return;busy=true;
    scene.classList.add('open');
    later(function(){scene.classList.add('out')},700);
    later(function(){scene.classList.add('full')},1700);
    later(function(){busy=false;if(!rm)confetti()},2500);
  });
  again.addEventListener('click',function(){
    if(busy)return;busy=true;
    scene.classList.remove('full');
    later(function(){scene.classList.remove('out')},900);
    later(function(){scene.classList.remove('open');busy=false;seal.focus()},1700);
  });
  function confetti(){
    var c=document.getElementById('fx'),x=c.getContext('2d'),w=c.width=innerWidth,h=c.height=innerHeight;
    var cols=['#c9a45c','#eadfc6','#46705f','#b5533c','#e8cd8f'],p=[];
    for(var i=0;i<90;i++)p.push({x:w/2+(Math.random()-.5)*w*.4,y:h*.35,vx:(Math.random()-.5)*9,vy:-Math.random()*9-3,s:4+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[i%5]});
    var t=0;
    (function f(){
      x.clearRect(0,0,w,h);t++;
      p.forEach(function(q){q.vy+=.22;q.vx*=.99;q.x+=q.vx;q.y+=q.vy;q.r+=q.vr;x.save();x.translate(q.x,q.y);x.rotate(q.r);x.fillStyle=q.c;x.fillRect(-q.s/2,-q.s/4,q.s,q.s/2);x.restore();});
      if(t<180)requestAnimationFrame(f);else x.clearRect(0,0,w,h);
    })();
  }
})();
</script>
